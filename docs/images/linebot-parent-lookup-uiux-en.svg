<svg width="1400" height="900" viewBox="0 0 1400 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">OpenPediCare LINE Bot parent lookup UIUX mockup</title>
  <desc id="desc">A LINE chat mockup showing a parent entering child visit information and receiving the most recent OpenPediCare post-visit record.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#17352f" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBF8"/>
      <stop offset="1" stop-color="#EDF7F4"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>

  <g transform="translate(78 72)">
    <text x="0" y="0" fill="#13332D" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Segoe UI', sans-serif" font-size="40" font-weight="760">OpenPediCare LINE Bot</text>
    <text x="0" y="48" fill="#52645F" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Segoe UI', sans-serif" font-size="20">Parents add the bot before the visit, bind details, then retrieve the latest record.</text>
  </g>

  <g transform="translate(94 148)" filter="url(#shadow)">
    <rect x="0" y="0" width="458" height="684" rx="46" fill="#111D1A"/>
    <rect x="18" y="18" width="422" height="648" rx="34" fill="#F2F7F4"/>
    <rect x="18" y="18" width="422" height="82" rx="34" fill="#06C755"/>
    <rect x="160" y="30" width="120" height="8" rx="4" fill="#0F2E25" fill-opacity="0.25"/>
    <circle cx="59" cy="63" r="21" fill="#E9FFF3"/>
    <text x="92" y="58" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Segoe UI', sans-serif" font-size="19" font-weight="740">OpenPediCare</text>
    <text x="92" y="82" fill="#E8FFF1" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Segoe UI', sans-serif" font-size="13">Post-visit lookup</text>

    <rect x="42" y="128" width="270" height="86" rx="22" fill="white"/>
    <text x="62" y="158" fill="#263C36" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Segoe UI', sans-serif" font-size="17" font-weight="700">Bind before the visit</text>
    <text x="62" y="184" fill="#60736D" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Segoe UI', sans-serif" font-size="15">Child name + guardian contact</text>
    <text x="62" y="204" fill="#60736D" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Segoe UI', sans-serif" font-size="15">Use the same contact at clinic</text>

    <rect x="108" y="242" width="300" height="68" rx="24" fill="#D9FDD3"/>
    <text x="132" y="271" fill="#1C382F" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Segoe UI', sans-serif" font-size="16">Bind Demo Child</text>
    <text x="132" y="295" fill="#1C382F" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Segoe UI', sans-serif" font-size="16">parent@example.test</text>

    <rect x="42" y="338" width="346" height="244" rx="24" fill="white"/>
    <text x="66" y="372" fill="#13332D" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Segoe UI', sans-serif" font-size="18" font-weight="760">Latest post-visit record</text>
    <text x="66" y="404" fill="#42564F" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Segoe UI', sans-serif" font-size="15">Child: Demo Child, age 7</text>
    <text x="66" y="428" fill="#42564F" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Segoe UI', sans-serif" font-size="15">Visit: Acute fever · Follow-up</text>
    <line x1="66" y1="452" x2="348" y2="452" stroke="#E4ECE8"/>
    <text x="66" y="482" fill="#13332D" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Segoe UI', sans-serif" font-size="15" font-weight="720">Summary</text>
    <text x="66" y="508" fill="#52645F" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Segoe UI', sans-serif" font-size="14">Fever yesterday, energy acceptable today;</text>
    <text x="66" y="530" fill="#52645F" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Segoe UI', sans-serif" font-size="14">hydrate, rest, and watch warning signs.</text>
    <rect x="66" y="550" width="162" height="34" rx="17" fill="#E9F7F1"/>
    <text x="84" y="573" fill="#087C4A" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Segoe UI', sans-serif" font-size="14" font-weight="700">Open full record</text>

    <rect x="42" y="610" width="366" height="36" rx="18" fill="white"/>
    <text x="64" y="633" fill="#8A9B95" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Segoe UI', sans-serif" font-size="14">Type a message...</text>
  </g>

  <g transform="translate(628 178)">
    <rect x="0" y="0" width="650" height="570" rx="32" fill="white" filter="url(#shadow)"/>
    <text x="48" y="62" fill="#13332D" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Segoe UI', sans-serif" font-size="30" font-weight="780">Parent Binding Flow</text>
    <text x="48" y="96" fill="#5F706B" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Segoe UI', sans-serif" font-size="17">The webhook verifies LINE, stores userId binding, then finds the latest record.</text>

    <g transform="translate(54 142)">
      <circle cx="24" cy="24" r="24" fill="#06C755"/>
      <text x="18" y="32" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="780">1</text>
      <text x="70" y="16" fill="#13332D" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Segoe UI', sans-serif" font-size="20" font-weight="740">Parent adds friend and binds before visit</text>
      <text x="70" y="43" fill="#52645F" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Segoe UI', sans-serif" font-size="16">The bot saves LINE userId with child name and guardian contact.</text>
    </g>

    <g transform="translate(54 236)">
      <circle cx="24" cy="24" r="24" fill="#06C755"/>
      <text x="18" y="32" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="780">2</text>
      <text x="70" y="16" fill="#13332D" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Segoe UI', sans-serif" font-size="20" font-weight="740">Doctor records visit with same contact</text>
      <text x="70" y="43" fill="#52645F" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Segoe UI', sans-serif" font-size="16">Patient guardian phone/email links the web visit to LINE binding.</text>
    </g>

    <g transform="translate(54 330)">
      <circle cx="24" cy="24" r="24" fill="#06C755"/>
      <text x="18" y="32" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="780">3</text>
      <text x="70" y="16" fill="#13332D" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Segoe UI', sans-serif" font-size="20" font-weight="740">Parent sends Latest after the visit</text>
      <text x="70" y="43" fill="#52645F" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Segoe UI', sans-serif" font-size="16">Bot replies with summary, care guidance, warning signs, and link.</text>
    </g>

    <rect x="48" y="438" width="554" height="84" rx="22" fill="#F3FAF6"/>
    <text x="74" y="472" fill="#0B6B44" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Segoe UI', sans-serif" font-size="18" font-weight="760">Privacy guardrail</text>
    <text x="74" y="500" fill="#52645F" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Segoe UI', sans-serif" font-size="16">If details do not match, the bot only returns a generic privacy-safe message.</text>
  </g>
</svg>
